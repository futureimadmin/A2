name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java }}
          path: "**/target/surefire-reports/**"
          retention-days: 7

  integration-redis:
    name: Integration Tests (Redis)
    runs-on: ubuntu-latest
    needs: build

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Run Redis integration tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: >-
          mvn -B -ntp -pl a2-core -am test
          -Dtest=RedisTokenStoreIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false

  # SonarQube / SonarCloud — server-side analysis + Quality Gate
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    # Only run when SONAR_TOKEN is configured (skips on forks / until secret is set)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Skip when SONAR_TOKEN is not set
        id: sonar_check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN not configured — skipping SonarQube analysis"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, coverage & SonarQube analysis
        if: steps.sonar_check.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          HOST_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
          ORG="${SONAR_ORGANIZATION:-futureimadmin}"
          PROJECT_KEY="${SONAR_PROJECT_KEY:-futureimadmin_A2}"

          mvn -B -ntp clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="$HOST_URL" \
            -Dsonar.organization="$ORG" \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.projectName="A2" \
            -Dsonar.java.source=17 \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # SonarLint-style static checks in CI (SpotBugs + PMD mirror common Sonar rules locally)
  # Complements IDE SonarLint; does not require a Sonar server token.
  sonarlint-ci:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Run SpotBugs & PMD
        run: |
          mvn -B -ntp -Pstatic-analysis verify \
            -DskipTests \
            || true
        # Non-blocking initially: reports uploaded even if findings exist.
        # Tighten to fail-on-error once baseline is clean.

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/target/spotbugsXml.xml
            **/target/pmd.xml
            **/target/site/pmd.html
            **/target/site/spotbugs.html
          retention-days: 14
          if-no-files-found: ignore

  publish:
    name: Publish to Maven Central
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [ build, integration-redis ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy (signed, autoPublish=false)
        run: mvn -B -ntp -Prelease deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
