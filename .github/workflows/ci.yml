name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java }}
          path: "**/target/surefire-reports/**"
          retention-days: 7

  integration-redis:
    name: Integration Tests (Redis)
    runs-on: ubuntu-latest
    needs: build

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # -pl a2-core -am builds dependencies; -Dtest would otherwise fail on modules
      # that have no matching test class (Surefire 3.x default).
      - name: Run Redis integration tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: >-
          mvn -B -ntp -pl a2-core -am test
          -Dtest=RedisTokenStoreIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false

  # Publish is manual only — not triggered by push/PR.
  # Activate via workflow_dispatch on main when ready to release.
  publish:
    name: Publish to Maven Central
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [ build, integration-redis ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy (signed, autoPublish=false)
        run: mvn -B -ntp -Prelease deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
