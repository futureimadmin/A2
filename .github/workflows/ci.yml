name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - run: mvn -B -ntp clean verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java }}
          path: "**/target/surefire-reports/**"
          retention-days: 7

  integration-redis:
    name: Integration Tests (Redis)
    runs-on: ubuntu-latest
    needs: build
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: >-
          mvn -B -ntp -pl a2-core -am test
          -Dtest=RedisTokenStoreIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false

  sonar:
    name: Sonar Analysis (Cloud or Server)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - id: sonar_check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.sonar_check.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOST_URL="${{ secrets.SONAR_HOST_URL }}"
          [ -z "$HOST_URL" ] && HOST_URL="https://sonarcloud.io"
          ORG="${{ vars.SONAR_ORGANIZATION }}"; [ -z "$ORG" ] && ORG="futureimadmin"
          KEY="${{ vars.SONAR_PROJECT_KEY }}"; [ -z "$KEY" ] && KEY="futureimadmin_A2"
          GH_BRANCH="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA="-Dsonar.pullrequest.key=${{ github.event.pull_request.number }} -Dsonar.pullrequest.branch=${{ github.head_ref }} -Dsonar.pullrequest.base=${{ github.base_ref }}"
          else
            SONAR_BRANCH="master"; [ "$GH_BRANCH" != "main" ] && SONAR_BRANCH="$GH_BRANCH"
            EXTRA="-Dsonar.branch.name=$SONAR_BRANCH"
          fi
          mvn -B -ntp -Psonar clean verify sonar:sonar \
            -Dsonar.host.url="$HOST_URL" -Dsonar.organization="$ORG" -Dsonar.projectKey="$KEY" \
            -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait=false $EXTRA

  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn -B -ntp -Pstatic-analysis verify -DskipTests || true

  # Publish ONLY after ALL jobs succeed + manual workflow_dispatch on main
  publish:
    name: Publish to Maven Central
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, integration-redis, sonar, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Require release secrets
        env:
          U: ${{ secrets.OSSRH_USERNAME }}
          T: ${{ secrets.OSSRH_TOKEN }}
          G: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$U" ] || [ -z "$T" ] || [ -z "$G" ]; then
            echo "::error::Missing OSSRH_USERNAME, OSSRH_TOKEN, or GPG_PRIVATE_KEY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy 1.0.0 (signed, autoPublish=false)
        run: mvn -B -ntp -Prelease clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
