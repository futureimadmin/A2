# Optional standalone scanner config (Maven properties in pom.xml take precedence).
# Used mainly as documentation / for sonar-scanner CLI outside Maven.

sonar.projectKey=futureimadmin_A2
sonar.organization=futureimadmin
sonar.projectName=A2

sonar.sources=.
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# Exclude generated / build output
sonar.exclusions=**/target/**,**/.git/**,**/generated-sources/**

# JaCoCo (paths relative to module roots when using Maven multi-module)
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
